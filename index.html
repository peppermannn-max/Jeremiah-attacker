<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Jeremiah Attack Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">⚠ LIVE TRACKER</div>
      <h1>THE JEREMIAH<br><span>ATTACK TRACKER</span></h1>
      <p class="sub">When Jeremiah attacks, there is only one thing to do.</p>

      <div class="counter-card">
        <div class="label">TOTAL ATTACKS</div>
        <div id="total" class="total">0</div>
        <button id="attackBtn" class="attack-btn" type="button">🚨 JEREMIAH ATTACKED 🚨</button>
        <div id="status" class="status" aria-live="polite">Standing by…</div>
      </div>

      <div class="stats">
        <article><span id="today">0</span><small>Today</small></article>
        <article><span id="week">0</span><small>This week</small></article>
        <article><span id="last">Never</span><small>Last attack</small></article>
      </div>
    </section>

    <section class="history-card">
      <h2>Recent Attacks</h2>
      <div id="history" class="history"><p class="empty">No attacks recorded yet. Stay vigilant.</p></div>
    </section>

    <footer>Jeremiah's actions are being documented for historical purposes.</footer>
  </main>

  <div id="flash" class="flash" aria-hidden="true"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
